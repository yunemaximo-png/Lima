<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Cadastro</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form action="https://webhook.site/be80aa45-9f31-453a-a3aa-38b963b3243d" method="post">
       <label for="nome">Nome:</label>
        <input 
        type="text" 
        id="nome" 
        name="nome" 
        required 
        min-length="2"
        max-length="50"
        placeholder="Digite seu nome"
        >
        <br><br>
        
        <label for="email">E-mail:</label>
        <input 
        type="email" 
        id="email" 
        name="email" 
        required 
        placeholder="exemplo@dominio.com"
        >
        <br><br>
        
        <label for="telefone">Telefone:</label>
        <input 
        type="tel" 
        id="telefone" 
        name="telefone" 
        required 
        placeholder="(XX) XXXXX-XXXX"
        pattern="\(\d{2}\) \d{4, 5}-\d{4}"
        >
        <br><br>
        
        <label for="idade">Idade:</label>
        <input 
        type="number" 
        id="idade" 
        name="idade" 
        required 
        min-length="18"
        max-length="120"
        step="1"
        placeholder="18"
        >
        <br><br>
        
        <label for="data-nascimento">Data de nascimento:</label>
        <input 
        type="date" 
        id="data-nascimento" 
        name="data-nascimento" 
        required 
        min="1900-01-01"
        max="2026-07-24"
        >
        <br><br>
    
        <label for="website">Página Pessoal:</label>
        <input 
        type="url" 
        id="website" 
        name="website" 
        required 
        placeholder="https://www.seusite.com"
        >
        <br><br>
        
        <label for="comentarios">Comentários:</label>
        <textarea
        id="comentarios" 
        name="comentarios" 
        rows="4"
        cols="50"
        max-length="50"
        placeholder="Digite seu comentário aqui"
        >
        </textarea>
        <br><br>

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
