<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Formulario</title>
</head>
<body>
    <form id="meuFormulario" action="https://webhook.site/be80aa45-9f31-453a-a3aa-38b963b3243d" method="post">
        <label for="nome">Nome:</label>
        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
            required
        >

        <label for="email">E-mail:</label>
        <input 
            type="email" 
            id="email"
            name="email"
            placeholder="E-mail@exemplo.com"
            required
        >

        <label for="senha">Senha:</label>
        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            minlength="8"
            pattern="(?.*[a-z])(?.*[A-Z])(?.*\d)(?.*[@$%*?&])[A-Za-z\d@$%*?&]{8,}"
            required
        >   

        <label for="idade">Idade:</label>
        <input 
        type="number" 
        id="idade"
        name="idade"
        min="0"
        max="120"
        step="1"
        placeholder="0"
        ></input>
        <button type="submit">Enviar</button>
       
    </form>
</body>
</html>
