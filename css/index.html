<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de CSS</title>
    <link rel="stylesheet" href=".\estilo.css">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: aquamarine;
            margin: 0;
            padding: 20px;
        }

        h1{
            color: blueviolet;
            font-size: 24px;

        }
        
        p{
            color: lightskyblue;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>Bem-vindo ao Estilo Interno</h1>

    <p>Este parágrafo utiliza definidos na tag &lt;style&gt;</p>
    <!--Estilização em linha-->
    <p style="color: rgb(102, 0, 255); font-size: 18px;">
        Este texto está estilizado em linha
    </p>
</body>
</html>
